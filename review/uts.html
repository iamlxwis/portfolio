<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding the Self - Study Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --success: #16a085;
            --danger: #e74c3c;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #7f8c8d;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: 'Fraunces', serif;
            color: var(--primary);
            margin: 0 0 10px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
        }

        .motto {
            font-size: 14px;
            color: var(--text-light);
            font-style: italic;
            margin-top: 5px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #e2e8e6;
            padding: 5px;
            border-radius: 10px;
        }

        .nav-btn {
            padding: 10px 20px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        .nav-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .section {
            display: none;
            width: 100%;
            max-width: 600px;
            flex-direction: column;
            align-items: center;
        }

        .section.active {
            display: flex;
        }

        /* Flashcard Styles */
        .flashcard-container {
            width: 100%;
            height: 320px;
            perspective: 1000px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 15px;
            font-size: 22px;
            background-color: var(--card-bg);
            line-height: 1.4;
        }

        .card-front {
            border-top: 8px solid var(--accent);
        }

        .card-front::before {
            content: 'QUESTION';
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #bdc3c7;
            letter-spacing: 1.5px;
        }

        .card-back {
            color: var(--success);
            transform: rotateY(180deg);
            border-top: 8px solid var(--success);
        }

        .card-back::before {
            content: 'ANSWER';
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #bdc3c7;
            letter-spacing: 1.5px;
        }

        /* Quiz Styles */
        .quiz-setup {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .quiz-setup input {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 15px 0;
            outline: none;
        }

        .quiz-setup input:focus {
            border-color: var(--accent);
        }

        .question-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 20px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            padding: 15px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            color: var(--text);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: #f1f8ff;
        }

        .option-btn.correct {
            background: #d4edda;
            border-color: var(--success);
            color: #155724;
        }

        .option-btn.wrong {
            background: #f8d7da;
            border-color: var(--danger);
            color: #721c24;
        }

        .quiz-stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
        }

        /* Shared Components */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            font-family: 'Poppins', sans-serif;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            background-color: var(--accent);
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            box-shadow: none;
        }

        .btn-outline:hover {
            background-color: var(--accent);
            color: white;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Understanding the Self</h1>
        <p class="motto">"We are our choices."</p>
    </div>

    <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab('flashcards')">Flashcards</button>
        <button class="nav-btn" onclick="switchTab('quiz')">Quiz Mode</button>
    </div>

    <!-- FLASHCARDS SECTION -->
    <div id="flashcards-section" class="section active">
        <div class="quiz-stats">
            <span id="fc-progress">Card 1 of 99</span>
        </div>
        
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front" id="card-front">Loading...</div>
                <div class="card-face card-back" id="card-back">Loading...</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-outline" id="prev-btn" onclick="prevCard()" disabled>Previous</button>
            <button class="btn" id="next-btn" onclick="nextCard()">Next</button>
        </div>
        <p class="motto" style="margin-top: 20px;">Use Spacebar to flip, Left/Right Arrows to navigate.</p>
    </div>

    <!-- QUIZ SECTION -->
    <div id="quiz-section" class="section">
        
        <!-- Setup -->
        <div id="quiz-setup" class="quiz-setup">
            <h2>Test Your Knowledge</h2>
            <p>How many questions would you like to answer?</p>
            <input type="number" id="quiz-length" value="10" min="1" max="99">
            <p style="font-size: 12px; color: var(--text-light); margin-top: -5px;">Max: 99</p>
            <button class="btn" style="margin-top: 15px;" onclick="startQuiz()">Start Quiz</button>
        </div>

        <!-- Active Quiz -->
        <div id="quiz-active" style="display: none; width: 100%;">
            <div class="quiz-stats">
                <span id="quiz-progress">Question 1 of 10</span>
                <span id="quiz-score">Score: 0</span>
            </div>
            
            <div class="question-box">
                <div class="question-text" id="quiz-question">Loading...</div>
                <div class="options-grid" id="quiz-options">
                    <!-- Options populated via JS -->
                </div>
            </div>
            
            <div style="display: flex; justify-content: flex-end;">
                <button class="btn" id="quiz-next-btn" style="display: none;" onclick="nextQuizQuestion()">Next Question</button>
            </div>
        </div>

        <!-- Quiz Results -->
        <div id="quiz-results" class="quiz-setup" style="display: none;">
            <h2>Quiz Complete!</h2>
            <h1 id="final-score" style="font-size: 48px; margin: 20px 0;">0/10</h1>
            <p id="score-message" style="margin-bottom: 25px;">Great job!</p>
            <button class="btn" onclick="document.getElementById('quiz-results').style.display='none'; document.getElementById('quiz-setup').style.display='block';">Take Another Quiz</button>
        </div>
    </div>

    <script>
        const flashcards = [
            {q: "What is Socrates' famous core axiom?", a: "“The unexamined life is not worth living.”"},
            {q: "How did Socrates view the self?", a: "As dualistic: body and soul."},
            {q: "What is the body according to Socrates?", a: "Physical, mortal, imperfect, and subject to change and decay."},
            {q: "What is the soul according to Socrates?", a: "Immortal, immaterial, rational, and the true seat of identity and moral agency."},
            {q: "What does psyche mean?", a: "Soul."},
            {q: "What does Socrates believe is the beginning of true wisdom?", a: "Introspection and examining one's beliefs."},
            {q: "What is arete?", a: "Moral excellence or virtue."},
            {q: "What did Plato add to Socratic dualism?", a: "The Tripartite Soul."},
            {q: "What are the three parts of Plato's soul?", a: "Reason, Spirit, and Appetite."},
            {q: "What is Reason (Nous)?", a: "The part that seeks truth, logic, and wisdom."},
            {q: "Where is Reason located?", a: "Head."},
            {q: "What is Spirit (Thumos)?", a: "The part seeking honor, courage, and justice."},
            {q: "Where is Spirit located?", a: "Chest."},
            {q: "What is Appetite (Epithumia)?", a: "The part driven by physical desires (hunger, thirst, lust, material wealth)."},
            {q: "Where is Appetite located?", a: "Belly."},
            {q: "Which part should rule the soul?", a: "Reason."},
            {q: "What happens when Reason successfully governs Spirit and Appetite?", a: "Mental health and justice occur."},
            {q: "What is Plato's overall model called?", a: "Tripartite Soul."},
            {q: "Who integrated Platonic dualism with Christianity?", a: "St. Augustine of Hippo."},
            {q: "What work is associated with Augustine's ideas about the self?", a: "Confessions."},
            {q: "How did Augustine view the body?", a: "Temporary and prone to temptation."},
            {q: "How did Augustine view the soul?", a: "Immortal, created by God, and destined for divine communion."},
            {q: "Where does Augustine believe truth can be found?", a: "Within human consciousness through inward reflection."},
            {q: "What is Divine Illumination?", a: "God's divine light guiding humans toward truth."},
            {q: "What is Liberum Arbitrium?", a: "Free will."},
            {q: "What does free will allow humans to do?", a: "Choose between worldly desires and divine truth."},
            {q: "What philosophical tradition did Descartes represent?", a: "Rationalism."},
            {q: "What is Rationalism?", a: "Knowledge primarily comes through reason."},
            {q: "What is Descartes' famous statement?", a: "“Cogito, ergo sum.”"},
            {q: "What does “Cogito, ergo sum” mean?", a: "“I think, therefore I am.”"},
            {q: "What is Descartes' view of the self?", a: "The self is a non-material thinking mind distinct from the body."},
            {q: "What is Descartes' theory called?", a: "Substance Dualism."},
            {q: "What is res cogitans?", a: "The thinking mind."},
            {q: "What is res extensa?", a: "The physical/mechanical body."},
            {q: "What does Descartes believe provides identity?", a: "Innate ideas and rational consciousness."},
            {q: "What philosophical tradition did Locke represent?", a: "Empiricism."},
            {q: "What is Empiricism?", a: "Knowledge comes primarily from sensory experience."},
            {q: "What is Locke's famous concept?", a: "Tabula rasa."},
            {q: "What does tabula rasa mean?", a: "“Blank slate.”"},
            {q: "How is the self formed according to Locke?", a: "Through experience, perception, and memory."},
            {q: "What connects a person to their past according to Locke?", a: "Consciousness and memory."},
            {q: "According to Locke, when are you the same person?", a: "As far back as your consciousness and memory extend."},
            {q: "What are Hume's two sources of mental content?", a: "Impressions and ideas."},
            {q: "What are impressions?", a: "Vivid, immediate sensory experiences."},
            {q: "What are ideas?", a: "Faint copies of impressions stored in memory and imagination."},
            {q: "What is Hume's Bundle Theory?", a: "The self is not a permanent entity but a bundle of passing perceptions."},
            {q: "What does Hume find when looking inward?", a: "Only passing perceptions, never a permanent self."},
            {q: "What metaphor does Hume use for the mind?", a: "A theater."},
            {q: "What is the important point of Hume's theater metaphor?", a: "Perceptions pass by, but there is no permanent “stage” or self behind them."},
            {q: "What was Kant's criticism of Hume?", a: "Sensory data alone would be chaotic without an organizing mind."},
            {q: "What is Transcendental Apperception?", a: "The self's ability to actively unify and organize sensory experiences."},
            {q: "How does Kant view the self?", a: "As an active organizing/processing engine."},
            {q: "Does Kant believe we simply record reality?", a: "No. The mind actively organizes experience."},
            {q: "What are examples of Kant's innate categories?", a: "Space, time, and causality."},
            {q: "What philosopher did Ryle criticize?", a: "Descartes."},
            {q: "What phrase did Ryle use against Cartesian dualism?", a: "“Ghost in the Machine.”"},
            {q: "What is a Category Error?", a: "Treating something as belonging to the wrong logical category."},
            {q: "What is Ryle's university analogy?", a: "Asking “Where is the university?” after seeing all its buildings mistakes the university for an additional physical building."},
            {q: "How does Ryle define the self?", a: "As a pattern of behavior and actions over time."},
            {q: "What philosophical approach is Ryle associated with?", a: "Logical Behaviorism."},
            {q: "Who said the self is basically an illusion?", a: "Hume."},
            {q: "Who said the self actively organizes experience?", a: "Kant."},
            {q: "Who rejected the “ghost in the machine”?", a: "Ryle."},
            {q: "What is phenomenology?", a: "The study of subjective, first-person lived experience."},
            {q: "What is Merleau-Ponty's view of the body?", a: "We don't merely have a body; we are our bodies."},
            {q: "What is the Body-Subject?", a: "The idea that mind and body are intertwined into one perceiving entity."},
            {q: "What is Motor Intentionality?", a: "The body's ability to internalize skills and perform them almost automatically."},
            {q: "Give an example of Motor Intentionality.", a: "Driving or playing an instrument without consciously thinking about every movement."},
            {q: "What happens to a tool when a skill becomes deeply internalized?", a: "It can feel like an extension of the body."},
            {q: "What is Sartre's famous statement?", a: "“Existence precedes essence.”"},
            {q: "What does “Existence precedes essence” mean?", a: "Humans exist first and define themselves through their choices."},
            {q: "Does Sartre believe humans have a predetermined nature?", a: "No."},
            {q: "What does Sartre mean by “condemned to be free”?", a: "Humans are fundamentally responsible for their choices."},
            {q: "What is Radical Freedom?", a: "The idea that humans have significant freedom to choose and define themselves."},
            {q: "What is Bad Faith?", a: "Making excuses or denying responsibility for one's choices."},
            {q: "Give an example of Bad Faith.", a: "“I had no choice. That's just how I am.”"},
            {q: "What does Dasein mean?", a: "“Being-there.”"},
            {q: "How does Heidegger view the self?", a: "As inherently Being-in-the-World."},
            {q: "What does Being-in-the-World mean?", a: "The self is deeply connected to its cultural, historical, and social environment."},
            {q: "Can we completely separate ourselves from our environment?", a: "No."},
            {q: "What is Ricoeur's theory of identity?", a: "Narrative Identity."},
            {q: "What are Ricoeur's two dimensions of identity?", a: "Idem and Ipse."},
            {q: "What is Idem?", a: "Sameness: stable physical/objective traits."},
            {q: "Examples of Idem?", a: "DNA and fingerprints."},
            {q: "What is Ipse?", a: "Selfhood: the evolving identity formed through choices, commitments, and character."},
            {q: "What is Narrative Identity?", a: "The idea that identity is an ongoing story connecting our past, present, and future."},
            {q: "What are the three pillars of personal identity?", a: "Continuity, Agency, and Consciousness."},
            {q: "What is Continuity?", a: "Feeling like the same person over time."},
            {q: "What is Agency?", a: "The experience of being the author of your choices and actions."},
            {q: "What is Consciousness?", a: "First-person awareness of experiencing life."},
            {q: "What is qualia?", a: "The subjective, first-person qualities of experience."},
            {q: "What was the main anchor of historical identity?", a: "Social roles, family lineage, community, and religion."},
            {q: "What is the main anchor of contemporary identity?", a: "Self-construction, flexibility, and digital platforms."},
            {q: "How stable was historical identity?", a: "Highly stable, localized, and largely given at birth."},
            {q: "How stable is contemporary identity?", a: "Dynamic, flexible, and constantly evolving."},
            {q: "What was the major psychological challenge in historical identity?", a: "Social conformity and fulfilling one's duty."},
            {q: "What is a major psychological challenge of contemporary identity?", a: "Authenticity crisis and personal-branding anxiety."},
            {q: "Where was historical self-expression mainly performed?", a: "Physical communities and direct relationships."},
            {q: "Where does contemporary self-expression happen?", a: "Both the physical world and curated digital/social-media spaces."}
        ];

        // --- NAVIGATION LOGIC ---
        let currentMode = 'flashcards';
        
        function switchTab(tab) {
            currentMode = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`${tab}-section`).classList.add('active');
        }

        // --- FLASHCARD LOGIC ---
        let fcIndex = 0;
        let isFlipped = false;
        
        const fcEl = document.getElementById('flashcard');
        const frontEl = document.getElementById('card-front');
        const backEl = document.getElementById('card-back');
        const fcProgress = document.getElementById('fc-progress');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateFlashcard() {
            frontEl.textContent = flashcards[fcIndex].q;
            backEl.textContent = flashcards[fcIndex].a;
            fcProgress.textContent = `Card ${fcIndex + 1} of ${flashcards.length}`;
            
            prevBtn.disabled = fcIndex === 0;
            nextBtn.disabled = fcIndex === flashcards.length - 1;
            
            if (isFlipped) {
                fcEl.classList.remove('is-flipped');
                isFlipped = false;
            }
        }

        function flipCard() {
            isFlipped = !isFlipped;
            fcEl.classList.toggle('is-flipped');
        }

        function nextCard() {
            if (fcIndex < flashcards.length - 1) {
                if (isFlipped) {
                    flipCard();
                    setTimeout(() => { fcIndex++; updateFlashcard(); }, 300);
                } else {
                    fcIndex++; updateFlashcard();
                }
            }
        }

        function prevCard() {
            if (fcIndex > 0) {
                if (isFlipped) {
                    flipCard();
                    setTimeout(() => { fcIndex--; updateFlashcard(); }, 300);
                } else {
                    fcIndex--; updateFlashcard();
                }
            }
        }

        // --- QUIZ LOGIC ---
        let quizQuestions = [];
        let currentQIndex = 0;
        let score = 0;
        let hasAnswered = false;

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz() {
            let length = parseInt(document.getElementById('quiz-length').value);
            if (isNaN(length) || length < 1) length = 10;
            if (length > flashcards.length) length = flashcards.length;

            const shuffledCards = shuffleArray(flashcards);
            quizQuestions = shuffledCards.slice(0, length);
            
            currentQIndex = 0;
            score = 0;
            
            document.getElementById('quiz-setup').style.display = 'none';
            document.getElementById('quiz-active').style.display = 'block';
            
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            hasAnswered = false;
            document.getElementById('quiz-next-btn').style.display = 'none';
            
            const currentQ = quizQuestions[currentQIndex];
            document.getElementById('quiz-question').textContent = currentQ.q;
            document.getElementById('quiz-progress').textContent = `Question ${currentQIndex + 1} of ${quizQuestions.length}`;
            document.getElementById('quiz-score').textContent = `Score: ${score}`;

            // Generate distractors
            const otherAnswers = flashcards.filter(f => f.a !== currentQ.a).map(f => f.a);
            const shuffledDistractors = shuffleArray(otherAnswers).slice(0, 3);
            
            let options = [currentQ.a, ...shuffledDistractors];
            options = shuffleArray(options);

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => selectAnswer(btn, opt === currentQ.a);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(btn, isCorrect) {
            if (hasAnswered) return;
            hasAnswered = true;

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => {
                b.disabled = true;
                if (b.textContent === quizQuestions[currentQIndex].a) {
                    b.classList.add('correct');
                }
            });

            if (isCorrect) {
                score++;
                document.getElementById('quiz-score').textContent = `Score: ${score}`;
            } else {
                btn.classList.add('wrong');
            }

            document.getElementById('quiz-next-btn').style.display = 'block';
            if (currentQIndex === quizQuestions.length - 1) {
                document.getElementById('quiz-next-btn').textContent = 'See Results';
            } else {
                document.getElementById('quiz-next-btn').textContent = 'Next Question';
            }
        }

        function nextQuizQuestion() {
            if (currentQIndex < quizQuestions.length - 1) {
                currentQIndex++;
                loadQuizQuestion();
            } else {
                showQuizResults();
            }
        }

        function showQuizResults() {
            document.getElementById('quiz-active').style.display = 'none';
            document.getElementById('quiz-results').style.display = 'block';
            
            document.getElementById('final-score').textContent = `${score}/${quizQuestions.length}`;
            
            const percentage = score / quizQuestions.length;
            let msg = '';
            if (percentage === 1) msg = "Perfect score! You've mastered this chapter.";
            else if (percentage >= 0.8) msg = "Great job! You know your philosophy well.";
            else if (percentage >= 0.5) msg = "Good effort. Keep reviewing those flashcards!";
            else msg = "Time to hit the flashcards again. You'll get it next time!";
            
            document.getElementById('score-message').textContent = msg;
        }

        // Global Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (currentMode === 'flashcards') {
                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowRight') {
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    prevCard();
                }
            }
        });

        // Init
        updateFlashcard();
    </script>
</body>
</html>
