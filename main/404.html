<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;--bg:#111;--fg:#f2f2f2;--muted:#929292;--line:#333}
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.65 Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:24px;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,black,transparent 75%);animation:drift 28s linear infinite}
main{width:min(100%,680px);position:relative;animation:enter .6s ease-out both}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:clamp(54px,12vh,110px)}
a{color:inherit;text-decoration:none}
a:hover{color:#aaa}
.logo{font-family:'Fraunces',Georgia,serif;font-size:1.12rem;font-weight:700;letter-spacing:-.055em}.logo em{color:#a0a0a0;font-style:italic;font-weight:500}
.label{font: .72rem monospace;color:var(--muted)}
.code{font: .75rem monospace;color:var(--muted);margin-bottom:16px}
h1{font-size:clamp(5rem,24vw,10rem);line-height:.82;letter-spacing:-.1em;margin-left:-.06em}
h2{font-size:1.05rem;font-weight:500;margin-top:30px}
p{color:var(--muted);font-size:.9rem;margin-top:9px;max-width:390px}
.actions{display:flex;align-items:center;gap:18px;margin-top:30px;flex-wrap:wrap}
.home{display:inline-flex;align-items:center;border:1px solid #555;padding:10px 14px;font-size:.82rem;transition:background .2s,transform .2s}
.home:hover{background:#222;transform:translateY(-2px);color:#fff}
.back{font-size:.82rem;color:var(--muted);text-decoration:underline;text-decoration-color:#444;text-underline-offset:4px}
footer{margin-top:clamp(60px,12vh,100px);border-top:1px solid var(--line);padding-top:16px;color:#666;font-size:.72rem}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{to{background-position:36px 36px,-36px 36px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Site-wide page transition and privacy notice */
#lx-page-loader{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#111;color:#f2f2f2;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease,visibility .22s ease}
#lx-page-loader.is-active{opacity:1;visibility:visible;pointer-events:auto}
.lx-loader-ring{width:34px;height:34px;border:2px solid #383838;border-top-color:#f2f2f2;border-radius:50%;animation:lx-spin .75s linear infinite}
.lx-loader-label{font:11px/1.5 monospace;letter-spacing:.12em;text-transform:uppercase;color:#aaa}
@keyframes lx-spin{to{transform:rotate(360deg)}}
#lx-cookie-banner{position:fixed;z-index:9997;left:20px;right:20px;bottom:20px;margin:0 auto;width:min(560px,calc(100% - 24px));display:none;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px;background:rgba(23,23,23,.97);border:1px solid #3b3b3b;box-shadow:0 16px 50px rgba(0,0,0,.4);backdrop-filter:blur(14px);font-family:Arial,Helvetica,sans-serif}
#lx-cookie-banner.is-visible{display:grid;animation:lx-cookie-in .35s ease both}
.lx-cookie-title{font-size:13px;font-weight:600;color:#f2f2f2;margin-bottom:4px}
.lx-cookie-copy{font-size:12px;line-height:1.55;color:#aaa;max-width:360px}
.lx-cookie-actions{display:flex;gap:7px;align-items:center}
.lx-cookie-button{border:1px solid #4a4a4a;background:transparent;color:#ddd;font:12px Arial,Helvetica,sans-serif;padding:8px 10px;cursor:pointer;white-space:nowrap}
.lx-cookie-button.primary{background:#f2f2f2;color:#111;border-color:#f2f2f2}
.lx-cookie-button:hover{opacity:.8}
@keyframes lx-cookie-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){#lx-cookie-banner{left:12px;right:12px;bottom:12px;width:auto;grid-template-columns:1fr;gap:12px;padding:15px}.lx-cookie-actions{justify-content:flex-end}.lx-cookie-copy{max-width:none}}
@media(prefers-reduced-motion:reduce){#lx-page-loader,#lx-cookie-banner{transition:none;animation:none!important}.lx-loader-ring{animation-duration:1.5s}}
.logo{font-family:'Fraunces',Georgia,serif;font-weight:700;letter-spacing:-.055em}.logo em{color:#a0a0a0;font-style:italic;font-weight:500}
</style>

<main>

<h1>404</h1>
<h2>Looks like this page doesn't exist.</h2>
<p>The link might be old, or the page may have moved. You can head back to the homepage.</p>
<div class="actions"><a class="home" href="/">Back to home ↗</a><a class="back" href="javascript:history.back()">Go back</a></div>
<footer>© 2026 lxwis</footer>

<div id="lx-page-loader" aria-hidden="true"><span class="lx-loader-ring" aria-hidden="true"></span><span class="lx-loader-label">Loading page</span></div>



<script src="/404.js?v=1" defer></script>
<script>
(function(){
  var loader=document.getElementById('lx-page-loader');
  var banner=document.getElementById('lx-cookie-banner');
  if(!loader)return;
  document.addEventListener('click',function(event){
    var link=event.target.closest&&event.target.closest('a[href]');
    if(!link||event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
    if(link.hasAttribute('download'))return;
    var target=(link.getAttribute('target')||'').toLowerCase();
    if(target&&target!=='_self')return;
    var href=link.getAttribute('href')||'';
    if(!href||href.charAt(0)==='#'||/^(mailto:|tel:|javascript:)/i.test(href))return;
    var destination;
    try{destination=new URL(link.href,window.location.href)}catch(e){return}
    if(destination.origin!==window.location.origin)return;
    if(destination.pathname===window.location.pathname&&destination.search===window.location.search&&destination.hash)return;
    if(event.defaultPrevented)return;
    loader.classList.add('is-active');
    loader.setAttribute('aria-hidden','false');
  });
  document.addEventListener('submit',function(event){
    if(event.defaultPrevented)return;
    var form=event.target;
    if(form&&form.getAttribute('target')==='_blank')return;
    loader.classList.add('is-active');
    loader.setAttribute('aria-hidden','false');
  });
  window.addEventListener('pageshow',function(){
    loader.classList.remove('is-active');
    loader.setAttribute('aria-hidden','true');
  });
  window.addEventListener('pagehide',function(){
    loader.classList.remove('is-active');
    loader.setAttribute('aria-hidden','true');
  });

})();
</script>
</body>
