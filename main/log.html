<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;--bg:#111;--fg:#f2f2f2;--muted:#929292;--line:#333;--soft:#c7c7c7}
body{background:var(--bg);color:var(--fg);font:16px/1.65 Arial,Helvetica,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,black,transparent 70%);z-index:-1}
a{color:inherit;text-decoration:none}a:hover{color:#aaa}
.wrap{width:min(100% - 80px,920px);margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:25px 0;border-bottom:1px solid var(--line)}
.logo{font-size:1rem;font-weight:700;letter-spacing:-.04em}
.back{font-size:.8rem;color:var(--muted)}
main{padding:92px 0 76px}
.eyebrow{font: .72rem monospace;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px}
h1{font-size:clamp(3.5rem,12vw,6rem);line-height:.9;letter-spacing:-.085em;margin-bottom:20px}
.intro{color:var(--muted);font-size:.95rem;max-width:500px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:45px 0 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.topline h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:500}
#updated{font: .7rem monospace;color:#777;text-align:right}
#entries{list-style:none}
.entry{display:grid;grid-template-columns:140px minmax(0,1fr);gap:28px;padding:25px 0;border-bottom:1px solid var(--line)}
.entry-date{font:.75rem/1.7 monospace;color:#777;padding-top:2px}
.entry-message{font-size:1rem;overflow-wrap:anywhere;max-width:720px}
.entry-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:9px;color:#777;font:.7rem monospace}
.entry-meta a{text-decoration:underline;text-decoration-color:#555;text-underline-offset:3px}
.hash{color:#aaa}
.state{padding:24px 0;color:var(--muted);font-size:.88rem;border-bottom:1px solid var(--line)}
.actions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:24px}
button{background:transparent;border:1px solid #484848;color:var(--fg);padding:9px 12px;font: .78rem Arial,Helvetica,sans-serif;cursor:pointer}
button:hover,button:focus-visible{border-color:#888;background:#1a1a1a;outline:none}
button:disabled{opacity:.5;cursor:wait}
.source{font-size:.75rem;color:#777}
footer{display:flex;justify-content:space-between;gap:16px;padding:25px 0 32px;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted)}
@media(min-width:1100px){main{padding-top:110px}.entry{padding:29px 0}}\n@media(max-width:900px){.wrap{width:min(100% - 48px,760px)}}\n@media(max-width:600px){.wrap{width:min(100% - 32px,760px)}main{padding:58px 0 45px}.entry{grid-template-columns:1fr;gap:5px;padding:18px 0}.topline{align-items:flex-start}.actions{align-items:flex-start;flex-direction:column}footer{flex-direction:column;gap:4px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}

.logo{font-family:'Fraunces',Georgia,serif;font-size:1.12rem;font-weight:700;letter-spacing:-.055em}.logo em{color:#a0a0a0;font-style:italic;font-weight:500}

</style>
<link rel="stylesheet" href="/privacy.css?v=5"><script src="/privacy.js?v=5" defer></script></head>
<body>
<div class="wrap">
<header><a class="logo" href="/" aria-label="lxwis home">lx<em>wis</em></a><a class="back" href="/">← back home</a></header>
<main>
<p class="eyebrow">Repository activity / 001</p>
<h1>Log</h1>
<p class="intro">A live list of changes pushed to my website's GitHub repository.</p>
<div class="topline"><h2>Recent commits</h2><span id="updated">Loading updates...</span></div>
<ul id="entries" aria-live="polite"><li class="state">Fetching the latest commits from GitHub...</li></ul>
<div class="actions"><button id="refresh" type="button">Refresh log</button><a class="source" href="https://github.com/iamlxwis/portfolio/commits/main/" target="_blank" rel="noopener noreferrer">View full history on GitHub ↗</a></div>
</main>
<footer><span>© 2026 lxwis</span><span>Updates from GitHub</span></footer>
</div>

<script>

(function(){
var list=document.getElementById('entries');
var updated=document.getElementById('updated');
var refresh=document.getElementById('refresh');
var endpoint='/api/log';
function make(tag,className,text){var el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el;}
function showState(message){list.replaceChildren(make('li','state',message));}
function formatDate(value){var date=new Date(value);if(Number.isNaN(date.getTime()))return 'Date unavailable';return new Intl.DateTimeFormat('en',{year:'numeric',month:'short',day:'2-digit',timeZone:'UTC'}).format(date);}
function render(commits){
list.replaceChildren();
if(!commits.length){showState('No commits were found.');return;}
commits.forEach(function(item){
var li=make('li','entry');
var date=make('time','entry-date',formatDate(item.commit.author.date||item.commit.committer.date));
date.dateTime=item.commit.author.date||item.commit.committer.date;
var details=make('div','entry-details');
details.appendChild(make('p','entry-message',item.commit.message.split('\n')[0]));
var meta=make('div','entry-meta');
var author=make('span','',item.commit.author.name||'unknown author');
var hash=make('a','hash',item.sha.slice(0,7));hash.href=item.html_url;hash.target='_blank';hash.rel='noopener noreferrer';hash.setAttribute('aria-label','View commit '+item.sha.slice(0,7)+' on GitHub');
var link=make('a','', 'view change ↗');link.href=item.html_url;link.target='_blank';link.rel='noopener noreferrer';
meta.append(author,hash,link);details.appendChild(meta);li.append(date,details);list.appendChild(li);
});
}
async function load(){
refresh.disabled=true;refresh.textContent='Loading...';updated.textContent='Checking GitHub...';
try{
var response=await fetch(endpoint,{headers:{'Accept':'application/vnd.github+json'}});
if(!response.ok){var problem=await response.json().catch(function(){return {};});if(response.status===403||response.status===429)throw new Error('GitHub is rate-limiting requests. Try again in a little while.');throw new Error(problem.error||('Request failed with status '+response.status+'.'));}
var commits=await response.json();
if(!Array.isArray(commits))throw new Error('GitHub returned an unexpected response.');
render(commits);
updated.textContent='Updated '+new Intl.DateTimeFormat('en',{hour:'2-digit',minute:'2-digit'}).format(new Date());
}catch(error){
showState(error.message+' The full history is still available on GitHub.');
updated.textContent='Could not load';
}finally{refresh.disabled=false;refresh.textContent='Refresh log';}
}
refresh.addEventListener('click',load);
load();
})();

</script>
</body>
</html>
