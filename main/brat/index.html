<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>brat</title><link rel="stylesheet" href="/brat/style.css?v=22"><script src="/brat/script.js?v=22" defer></script><link rel="stylesheet" href="/privacy.css?v=3"><script src="/privacy.js?v=3" defer></script></head><body>
<header><a href="/" class="logo">brat.</a><div class="header-actions"><button id="themeToggle" class="icon" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24"><path d="M20 15A8 8 0 0 1 9 4a8 8 0 1 0 11 11Z"/></svg></button><button id="downloadTop" class="export">export <svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg></button></div></header>
<main><section class="art-area"><div class="art-shell"><div id="art" class="art" aria-label="Graphic preview"><div id="artText" class="art-text"></div></div></div></section>
<aside class="controls"><div class="controls-inner"><div class="control"><label for="mainText">text</label><textarea id="mainText" rows="3" spellcheck="false"></textarea></div><div class="control"><label>color</label><div class="swatches"><button class="swatch" data-palette="classic" style="--c:#8ace00" aria-label="Green"></button><button class="swatch" data-palette="pink" style="--c:#f1a6c9" aria-label="Pink"></button><button class="swatch" data-palette="white" style="--c:#f4f4f0" aria-label="White"></button><button class="swatch" data-palette="blue" style="--c:#1766ef" aria-label="Blue"></button><button class="swatch" data-palette="black" style="--c:#141414" aria-label="Black"></button></div><div class="color-pickers"><label>bg <input id="bgColor" type="color"></label><label>text <input id="textColor" type="color"></label></div></div><div class="control"><label for="blur">blur</label><input id="blur" type="range" min="0" max="5" step=".1"></div><details><summary>more <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></summary><div class="extras"><label>grain <input id="grain" type="range" min="0" max="35"></label><label>size <select id="canvasSize"><option value="square">square</option><option value="portrait">portrait</option><option value="story">story</option><option value="landscape">landscape</option></select></label><label>font <select id="fontFamily"><option value="Arial, Helvetica, sans-serif">arial</option><option value="'Arial Narrow', Arial, sans-serif">narrow</option><option value="'Courier New', monospace">mono</option></select></label><label>text size <input id="sizeAdjust" type="range" min="60" max="140" value="100"></label><label>line spacing <input id="lineHeight" type="range" min="75" max="125" value="100"></label><label>format <select id="exportFormat"><option value="png">png</option><option value="jpeg">jpg</option><option value="webp">webp</option></select></label><label>quality <select id="exportScale"><option value="1">1080px</option><option value="2">2160px</option></select></label><div class="upload-row"><span>image</span><label class="upload-button" for="imageInput"><svg viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 16v4h16v-4"/></svg><span id="uploadLabel">upload image</span></label><input class="visually-hidden" type="file" id="imageInput" accept="image/*"></div><button id="removeImage" class="plain">remove image</button><button id="resetDesign" class="plain">reset</button></div></details><button id="download" class="download">download <svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg></button></div></aside></main><div id="toast" role="status" aria-live="polite"></div></body></html>
