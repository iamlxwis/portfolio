<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>brat — graphic maker</title><meta name="description" content="Make your own brat graphic."><link rel="stylesheet" href="/brat/style.css?v=11"><script src="/brat/script.js?v=11" defer></script></head>
<body>
<div class="app new-layout">
<header class="header"><a class="wordmark" href="/" aria-label="Back to portfolio">brat<span class="spark">✳</span></a><div class="header-right"><button class="icon-button" id="undo" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button><button class="icon-button" id="redo" aria-label="Redo" title="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5m5 5H10a6 6 0 0 0 0 12h2"/></svg></button><button class="icon-button" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode"><svg viewBox="0 0 24 24"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg></button><button id="downloadTop" class="download-top"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg><span>Export</span></button></div></header>
<main class="workspace">
<section class="preview" aria-label="Live graphic preview"><div class="preview-top"><span class="preview-title">YOUR CANVAS</span><span id="canvasInfo">1080 × 1080</span></div><div class="preview-area" id="previewArea"><canvas id="artCanvas" width="540" height="540" aria-label="Your graphic"></canvas></div><div class="preview-bottom"><span>LIVE · AUTO FIT</span><button id="resetDesign" class="text-button">Reset</button></div></section>
<aside class="editor" aria-label="Graphic editor"><div class="editor-title"><div><span class="eyebrow">01 / DESIGN</span><h1>your graphic<span class="period">.</span></h1></div></div>
<div class="editor-scroll"><div class="mobile-tip">EDIT BELOW · PREVIEW ABOVE</div>
<div class="field words"><label for="mainText">01 <span>YOUR WORDS</span></label><textarea id="mainText" rows="3" spellcheck="false" placeholder="type anything"></textarea><div class="field-note">Automatically wraps to fit your graphic.</div></div>
<div class="field"><label for="palette">02 <span>PALETTE</span></label><div class="swatches" id="swatches" aria-label="Color themes"><button class="swatch" data-palette="classic" style="--swatch:#8ace00" aria-label="Classic green"></button><button class="swatch" data-palette="pink" style="--swatch:#f1a6c9" aria-label="Pink"></button><button class="swatch" data-palette="white" style="--swatch:#f4f4f0" aria-label="White"></button><button class="swatch" data-palette="blue" style="--swatch:#1766ef" aria-label="Blue"></button><button class="swatch" data-palette="orange" style="--swatch:#ff6839" aria-label="Orange"></button><button class="swatch" data-palette="black" style="--swatch:#141414" aria-label="Black"></button></div><div class="color-row"><label class="color-control">Background <input type="color" id="bgColor" value="#8ace00"></label><label class="color-control">Text <input type="color" id="textColor" value="#141414"></label></div></div>
<div class="field"><div class="field-heading"><label for="blur">03 <span>FINISH</span></label><button id="resetEffects" class="text-button">Clear</button></div><div class="slider-field"><span>Blur</span><input id="blur" type="range" min="0" max="8" step=".2" value="1"></div><div class="slider-field"><span>Grain</span><input id="grain" type="range" min="0" max="40" step="1" value="0"></div></div>
<details class="more"><summary>More options <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></summary><div class="more-body"><div class="field"><label for="canvasSize">Canvas size</label><select id="canvasSize"><option value="square">Square · 1:1</option><option value="portrait">Portrait · 4:5</option><option value="story">Story · 9:16</option><option value="landscape">Landscape · 16:9</option></select></div><div class="field"><label for="fontFamily">Font</label><select id="fontFamily"><option value="Arial, Helvetica, sans-serif">Classic sans</option><option value="'Arial Narrow', Arial, sans-serif">Narrow sans</option><option value="'Courier New', monospace">Mono</option><option value="Georgia, serif">Serif</option></select></div><div class="field"><label for="layoutMode">Text layout</label><select id="layoutMode"><option value="auto">Smart wrap</option><option value="manual">Keep my line breaks</option></select></div><div class="field"><label for="sizeAdjust">Text size <span id="sizeLabel">100%</span></label><input type="range" id="sizeAdjust" min="60" max="140" value="100"></div><div class="field"><label for="lineHeight">Line spacing <span id="lineLabel">100%</span></label><input type="range" id="lineHeight" min="75" max="135" value="100"></div><div class="field"><label for="imageInput">Add photo</label><input type="file" id="imageInput" accept="image/*"><button id="removeImage" class="text-button">Remove photo</button></div><div class="field"><label for="exportFormat">Export format</label><select id="exportFormat"><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option></select></div><div class="field"><label for="exportScale">Export quality</label><select id="exportScale"><option value="1">1080px</option><option value="2">2160px</option></select></div></div></details>
</div><div class="editor-footer"><button id="download" class="download"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg>SAVE GRAPHIC</button></div>
</aside></main></div><div id="toast" role="status" aria-live="polite"></div>
</body></html>
