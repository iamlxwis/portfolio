<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arf Gallery · lxwis</title>
  <meta name="description" content="Random dog gallery." />
  <meta name="theme-color" content="#14110D" />
  <link rel="icon" type="image/webp" href="https://i.imgur.com/9jrzHF1_d.webp?maxwidth=64&fidelity=grand" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --noir: #14110D;
      --bone: #ECE6D6;
      --clay: #C17D54;
      --ash:  #7A7165;
      --line: #2C2720;
      --display: 'Fraunces', Georgia, serif;
      --mono: 'JetBrains Mono', monospace;
    }

    html { font-size: 16px; }
    body { background: var(--noir); color: var(--bone); font-family: var(--mono); min-height: 100vh; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-thumb { background: var(--clay); }

    header { max-width: 1100px; margin: 0 auto; padding: 2.25rem 2rem 0; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: var(--display); font-size: 1.05rem; font-weight: 700; }
    .logo em { color: var(--clay); font-style: italic; }
    .nav-back { font-size: 0.68rem; color: var(--ash); transition: color .2s; }
    .nav-back:hover { color: var(--bone); }

    .hero { max-width: 760px; margin: 0 auto; padding: 5rem 2rem 3.5rem; border-bottom: 1px solid var(--line); }
    .hero-eyebrow { font-size: 0.68rem; color: var(--clay); letter-spacing: 0.08em; margin-bottom: 1.25rem; }
    .hero-title {
      font-family: var(--display);
      font-size: clamp(2.6rem, 9vw, 5rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }
    .hero-title em { font-style: italic; color: var(--clay); }
    .hero-sub { font-size: 0.78rem; color: var(--ash); line-height: 1.75; max-width: 360px; margin-bottom: 1.75rem; }
    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.72rem;
      color: var(--noir);
      background: var(--clay);
      padding: 0.7rem 1.4rem;
      border-radius: 3px;
      border: none;
      cursor: pointer;
      font-family: var(--mono);
      transition: opacity .2s;
    }
    .hero-btn:hover { opacity: 0.85; }

    .stats-bar {
      max-width: 760px;
      margin: 0 auto;
      padding: 1.1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .stat-text { font-size: 0.65rem; color: var(--ash); }
    .stat-count { font-family: var(--display); font-size: 0.9rem; font-weight: 700; color: var(--clay); }
    .load-more-btn {
      font-size: 0.65rem;
      color: var(--clay);
      background: none;
      border: 1px solid var(--line);
      padding: 0.4rem 0.9rem;
      border-radius: 2px;
      cursor: pointer;
      font-family: var(--mono);
      transition: border-color .2s;
    }
    .load-more-btn:hover { border-color: var(--clay); }

    .gallery { padding: 2rem; display: none; }
    .gallery.visible { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 3px; max-width: 1100px; margin: 0 auto; }

    .grid-item { position: relative; aspect-ratio: 1; overflow: hidden; background: #1A1611; cursor: pointer; opacity: 0; animation: appear .4s ease forwards; }
    .grid-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease, filter .3s; filter: grayscale(15%); }
    .grid-item:hover img { transform: scale(1.06); filter: grayscale(0%); }
    .grid-item .overlay {
      position: absolute; inset: 0;
      background: rgba(20,17,13,0.6);
      opacity: 0;
      transition: opacity .3s;
      display: flex; align-items: flex-end;
      padding: 0.75rem;
    }
    .grid-item:hover .overlay { opacity: 1; }
    .overlay-label { font-size: 0.58rem; color: var(--clay); letter-spacing: 0.06em; }
    .skeleton {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, #1A1611 25%, #221E18 50%, #1A1611 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    .lightbox {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(20,17,13,0.97);
      display: none;
      align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 88vh; object-fit: contain; border: 1px solid var(--line); }
    .lb-close { position: absolute; top: 1.5rem; right: 1.5rem; font-size: 0.65rem; color: var(--ash); letter-spacing: 0.1em; cursor: pointer; transition: color .2s; }
    .lb-close:hover { color: var(--clay); }

    footer {
      max-width: 760px; margin: 0 auto;
      padding: 2rem 2rem;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.62rem; color: var(--ash);
    }
    footer a:hover { color: var(--clay); }

    @keyframes appear { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (max-width: 560px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 2px; }
      .stats-bar { flex-direction: column; gap: 0.6rem; align-items: flex-start; }
      footer { flex-direction: column; gap: 0.6rem; text-align: center; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">lx<em>wis</em></span>
    <a href="/" class="nav-back">← Home</a>
  </header>

  <div class="hero" id="hero">
    <p class="hero-eyebrow">Gallery</p>
    <h1 class="hero-title">Arf <em>gallery.</em></h1>
    <p class="hero-sub">A wall of dogs that refreshes itself. Click any one to see it full size.</p>
    <button class="hero-btn" id="startBtn">Show me dogs →</button>
  </div>

  <div class="stats-bar" id="statsBar" style="display:none">
    <span class="stat-text"><span class="stat-count" id="countNum">0</span> dogs loaded</span>
    <button class="load-more-btn" id="loadMoreBtn">Load more →</button>
  </div>

  <div class="gallery" id="gallery">
    <div class="grid" id="grid"></div>
  </div>

  <footer>
    <span>lxwis.site · Arf Gallery</span>
    <a href="https://dog.ceo" target="_blank">Images via dog.ceo ↗</a>
  </footer>

  <div class="lightbox" id="lightbox">
    <span class="lb-close" id="lbClose">ESC / CLOSE</span>
    <img id="lbImg" src="" alt="dog" />
  </div>

  <script>
    let count = 0;
    const BATCH = 30;
    const grid = document.getElementById('grid');
    const countNum = document.getElementById('countNum');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');

    function addSkeleton(delay) {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.style.animationDelay = delay + 's';
      item.innerHTML = '<div class="skeleton"></div>';
      grid.appendChild(item);
      return item;
    }

    async function fetchDog(item) {
      try {
        const res = await fetch('https://dog.ceo/api/breeds/image/random');
        if (!res.ok) throw new Error();
        const data = await res.json();
        const url = data.message;
        const img = document.createElement('img');
        img.alt = 'dog';
        img.src = url;
        img.loading = 'lazy';
        const ov = document.createElement('div');
        ov.className = 'overlay';
        ov.innerHTML = '<span class="overlay-label">Open full →</span>';
        item.querySelector('.skeleton').remove();
        item.appendChild(img);
        item.appendChild(ov);
        item.addEventListener('click', () => openLb(url));
        count++;
        countNum.textContent = count;
      } catch {
        item.remove();
      }
    }

    function loadBatch() {
      for (let i = 0; i < BATCH; i++) {
        const item = addSkeleton(i * 0.03);
        fetchDog(item);
      }
    }

    function openLb(url) { lbImg.src = url; lightbox.classList.add('open'); }
    function closeLb() { lightbox.classList.remove('open'); lbImg.src = ''; }

    document.getElementById('lbClose').addEventListener('click', closeLb);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLb(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('hero').style.display = 'none';
      document.getElementById('statsBar').style.display = 'flex';
      document.getElementById('gallery').classList.add('visible');
      loadBatch();
    });

    document.getElementById('loadMoreBtn').addEventListener('click', loadBatch);
  </script>
</body>
</html>
