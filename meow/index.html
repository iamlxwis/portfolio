<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meow Gallery · lxwis</title>
  <meta name="description" content="Random cat gallery." />
  <meta name="theme-color" content="#14110D" />
  <link rel="icon" type="image/webp" href="https://i.imgur.com/9jrzHF1_d.webp?maxwidth=64&fidelity=grand" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --noir: #14110D;
      --bone: #ECE6D6;
      --moss: #7E9B79;
      --ash:  #7A7165;
      --line: #2C2720;
      --display: 'Fraunces', Georgia, serif;
      --mono: 'JetBrains Mono', monospace;
    }

    html { font-size: 16px; }
    body { background: var(--noir); color: var(--bone); font-family: var(--mono); min-height: 100vh; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-thumb { background: var(--moss); }

    header { max-width: 1100px; margin: 0 auto; padding: 2.25rem 2rem 0; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: var(--display); font-size: 1.05rem; font-weight: 700; }
    .logo em { color: var(--moss); font-style: italic; }
    .nav-back { font-size: 0.68rem; color: var(--ash); transition: color .2s; }
    .nav-back:hover { color: var(--bone); }

    .hero { max-width: 760px; margin: 0 auto; padding: 5rem 2rem 3.5rem; border-bottom: 1px solid var(--line); }
    .hero-eyebrow { font-size: 0.68rem; color: var(--moss); letter-spacing: 0.08em; margin-bottom: 1.25rem; }
    .hero-title {
      font-family: var(--display);
      font-size: clamp(2.6rem, 9vw, 5rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }
    .hero-title em { font-style: italic; color: var(--moss); }
    .hero-sub { font-size: 0.78rem; color: var(--ash); line-height: 1.75; max-width: 360px; margin-bottom: 1.75rem; }
    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.72rem;
      color: var(--noir);
      background: var(--moss);
      padding: 0.7rem 1.4rem;
      border-radius: 3px;
      border: none;
      cursor: pointer;
      font-family: var(--mono);
      transition: opacity .2s;
    }
    .hero-btn:hover { opacity: 0.85; }

    .stats-bar {
      max-width: 760px;
      margin: 0 auto;
      padding: 1.1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }
    .stat-text { font-size: 0.65rem; color: var(--ash); }
    .stat-count { font-family: var(--display); font-size: 0.9rem; font-weight: 700; color: var(--moss); }
    .stats-actions { display: flex; align-items: center; gap: 0.5rem; }
    .load-more-btn, .fav-toggle-btn {
      font-size: 0.65rem;
      color: var(--moss);
      background: none;
      border: 1px solid var(--line);
      padding: 0.4rem 0.9rem;
      border-radius: 2px;
      cursor: pointer;
      font-family: var(--mono);
      transition: border-color .2s;
      white-space: nowrap;
    }
    .load-more-btn:hover, .fav-toggle-btn:hover { border-color: var(--moss); }

    .gallery { padding: 2rem; display: none; }
    .gallery.visible { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 3px; max-width: 1100px; margin: 0 auto; }
    .empty-note { color: var(--ash); font-size: 0.78rem; line-height: 1.7; padding: 1rem 0; grid-column: 1 / -1; }

    .grid-item { position: relative; aspect-ratio: 1; overflow: hidden; background: #1A1611; cursor: pointer; opacity: 0; animation: appear .4s ease forwards; }
    .grid-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease, filter .3s; filter: grayscale(15%); }
    .grid-item:hover img { transform: scale(1.06); filter: grayscale(0%); }
    .grid-item .overlay {
      position: absolute; inset: 0;
      background: rgba(20,17,13,0.6);
      opacity: 0;
      transition: opacity .3s;
      display: flex; align-items: flex-end;
      padding: 0.75rem;
    }
    .grid-item:hover .overlay { opacity: 1; }
    .overlay-label { font-size: 0.58rem; color: var(--moss); letter-spacing: 0.06em; }
    .skeleton {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, #1A1611 25%, #221E18 50%, #1A1611 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    .lightbox {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(20,17,13,0.97);
      display: none;
      align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
      touch-action: none;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 86vw; max-height: 80vh; object-fit: contain; border: 1px solid var(--line); }

    .lb-counter { position: absolute; top: 1.5rem; left: 1.5rem; font-size: 0.65rem; color: var(--ash); letter-spacing: 0.1em; }
    .lb-close { position: absolute; top: 1.5rem; right: 1.5rem; font-size: 0.65rem; color: var(--ash); letter-spacing: 0.1em; cursor: pointer; transition: color .2s; }
    .lb-close:hover { color: var(--moss); }

    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 1.7rem; color: var(--ash);
      background: none; border: none; cursor: pointer;
      padding: 0.5rem 0.85rem; line-height: 1;
      transition: color .2s;
      font-family: var(--mono);
    }
    .lb-nav:hover { color: var(--moss); }
    .lb-prev { left: 0; }
    .lb-next { right: 0; }

    .lb-download, .lb-favorite {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--ash);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: var(--mono);
      transition: color .2s;
    }
    .lb-download { left: 1.5rem; }
    .lb-favorite { right: 1.5rem; }
    .lb-download:hover, .lb-favorite:hover { color: var(--moss); }
    .lb-download:disabled { color: var(--ash); cursor: wait; opacity: 0.6; }
    .lb-favorite.active { color: var(--moss); }

    footer {
      max-width: 760px; margin: 0 auto;
      padding: 2rem 2rem;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.62rem; color: var(--ash);
    }
    footer a:hover { color: var(--moss); }

    @keyframes appear { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (max-width: 560px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 2px; }
      .stats-bar { flex-direction: column; align-items: flex-start; }
      .stats-actions { width: 100%; justify-content: space-between; }
      footer { flex-direction: column; gap: 0.6rem; text-align: center; }
      .lb-nav { font-size: 1.3rem; padding: 0.4rem 0.5rem; }
      .lb-counter, .lb-close { font-size: 0.6rem; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">lx<em>wis</em></span>
    <a href="/" class="nav-back">← Home</a>
  </header>

  <div class="hero" id="hero">
    <p class="hero-eyebrow">Gallery</p>
    <h1 class="hero-title">Meow <em>gallery.</em></h1>
    <p class="hero-sub">A wall of cats that refreshes itself. Tap any one to see it full size.</p>
    <button class="hero-btn" id="startBtn">Show me cats →</button>
  </div>

  <div class="stats-bar" id="statsBar" style="display:none">
    <span class="stat-text" id="statText"><span class="stat-count">0</span> cats loaded</span>
    <div class="stats-actions">
      <button class="load-more-btn" id="loadMoreBtn">Load more →</button>
      <button class="fav-toggle-btn" id="favToggleBtn">♥ Favorites (0)</button>
    </div>
  </div>

  <div class="gallery" id="gallery">
    <div class="grid" id="grid"></div>
  </div>

  <footer>
    <span>lxwis.site · Meow Gallery</span>
    <a href="https://cataas.com" target="_blank">Images via cataas.com ↗</a>
  </footer>

  <div class="lightbox" id="lightbox">
    <span class="lb-counter" id="lbCounter">1 / 1</span>
    <span class="lb-close" id="lbClose">ESC / CLOSE</span>
    <button class="lb-nav lb-prev" id="lbPrev">‹</button>
    <img id="lbImg" src="" alt="cat" />
    <button class="lb-nav lb-next" id="lbNext">›</button>
    <button class="lb-download" id="lbDownload">↓ SAVE IMAGE</button>
    <button class="lb-favorite" id="lbFavorite">♡ FAVORITE</button>
  </div>

  <script>
    const FAV_KEY = 'lxwis:meow:favorites';

    let mode = 'browse';      // 'browse' or 'favorites'
    let images = [];          // urls loaded this session, in visual order
    let favorites = [];
    try { favorites = JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { favorites = []; }

    let activeList = images;  // whichever list the lightbox is currently paging through
    let currentIndex = -1;
    let currentUrl = '';

    const BATCH = 30;
    const grid = document.getElementById('grid');
    const statText = document.getElementById('statText');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const favToggleBtn = document.getElementById('favToggleBtn');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbCounter = document.getElementById('lbCounter');
    const lbDownload = document.getElementById('lbDownload');
    const lbFavorite = document.getElementById('lbFavorite');
    const lbPrev = document.getElementById('lbPrev');
    const lbNext = document.getElementById('lbNext');

    function renderStats() {
      statText.innerHTML = mode === 'browse'
        ? `<span class="stat-count">${images.length}</span> cats loaded`
        : `<span class="stat-count">${favorites.length}</span> favorites saved`;
    }

    function updateFavToggleLabel() {
      favToggleBtn.textContent = mode === 'browse' ? `♥ Favorites (${favorites.length})` : '← Back to browsing';
    }

    function saveFavorites() {
      localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
      updateFavToggleLabel();
    }

    function makeGridItem(url, onClick) {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.style.opacity = '1';
      const img = document.createElement('img');
      img.src = url; img.alt = 'cat'; img.loading = 'lazy';
      const ov = document.createElement('div');
      ov.className = 'overlay';
      ov.innerHTML = '<span class="overlay-label">Open full →</span>';
      item.appendChild(img);
      item.appendChild(ov);
      item.addEventListener('click', onClick);
      return item;
    }

    function renderBrowseGrid() {
      grid.innerHTML = '';
      images.forEach((url, idx) => grid.appendChild(makeGridItem(url, () => { activeList = images; openLb(idx); })));
    }

    function renderFavoritesGrid() {
      grid.innerHTML = '';
      if (!favorites.length) {
        grid.innerHTML = '<p class="empty-note">No favorites yet. Open any cat and tap the heart.</p>';
        return;
      }
      favorites.forEach((url, idx) => grid.appendChild(makeGridItem(url, () => { activeList = favorites; openLb(idx); })));
    }

    function addSkeleton(delay) {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.style.animationDelay = delay + 's';
      item.innerHTML = '<div class="skeleton"></div>';
      grid.appendChild(item);
      return item;
    }

    async function fetchCat(item) {
      try {
        const res = await fetch('https://cataas.com/cat?json=true');
        if (!res.ok) throw new Error();
        const data = await res.json();
        const id = data._id || data.id;
        const url = `https://cataas.com/cat/${id}`;
        const idx = images.length;
        images.push(url);
        const img = document.createElement('img');
        img.alt = 'cat';
        img.src = url;
        img.loading = 'lazy';
        const ov = document.createElement('div');
        ov.className = 'overlay';
        ov.innerHTML = '<span class="overlay-label">Open full →</span>';
        item.querySelector('.skeleton').remove();
        item.appendChild(img);
        item.appendChild(ov);
        item.addEventListener('click', () => { activeList = images; openLb(idx); });
        renderStats();
      } catch {
        item.remove();
      }
    }

    function loadBatch() {
      for (let i = 0; i < BATCH; i++) {
        const item = addSkeleton(i * 0.03);
        fetchCat(item);
      }
    }

    function updateLbCounter() { lbCounter.textContent = `${currentIndex + 1} / ${activeList.length}`; }

    function updateFavIcon() {
      const isFav = favorites.includes(currentUrl);
      lbFavorite.textContent = isFav ? '♥ FAVORITED' : '♡ FAVORITE';
      lbFavorite.classList.toggle('active', isFav);
    }

    function openLb(idx) {
      currentIndex = idx;
      currentUrl = activeList[idx];
      lbImg.src = currentUrl;
      updateLbCounter();
      updateFavIcon();
      lightbox.classList.add('open');
    }

    function closeLb() { lightbox.classList.remove('open'); lbImg.src = ''; currentUrl = ''; }

    function showNext() {
      if (!activeList.length) return;
      currentIndex = (currentIndex + 1) % activeList.length;
      currentUrl = activeList[currentIndex];
      lbImg.src = currentUrl;
      updateLbCounter();
      updateFavIcon();
    }

    function showPrev() {
      if (!activeList.length) return;
      currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
      currentUrl = activeList[currentIndex];
      lbImg.src = currentUrl;
      updateLbCounter();
      updateFavIcon();
    }

    async function downloadCurrent() {
      if (!currentUrl) return;
      lbDownload.disabled = true;
      lbDownload.textContent = 'SAVING...';
      try {
        const res = await fetch(currentUrl);
        const blob = await res.blob();
        const ext = blob.type.includes('png') ? 'png' : 'jpg';
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `lxwis-cat-${Date.now()}.${ext}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(blobUrl);
      } catch {
        window.open(currentUrl, '_blank');
      } finally {
        lbDownload.disabled = false;
        lbDownload.textContent = '↓ SAVE IMAGE';
      }
    }

    function toggleFavorite() {
      if (!currentUrl) return;
      const i = favorites.indexOf(currentUrl);
      if (i === -1) favorites.push(currentUrl); else favorites.splice(i, 1);
      saveFavorites();
      updateFavIcon();
      if (mode === 'favorites') renderStats();
    }

    lbDownload.addEventListener('click', downloadCurrent);
    lbFavorite.addEventListener('click', toggleFavorite);
    lbPrev.addEventListener('click', showPrev);
    lbNext.addEventListener('click', showNext);
    document.getElementById('lbClose').addEventListener('click', closeLb);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLb(); });

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLb();
      if (e.key === 'ArrowRight') showNext();
      if (e.key === 'ArrowLeft') showPrev();
    });

    let touchStartX = 0, touchStartY = 0;
    lightbox.addEventListener('touchstart', e => {
      const t = e.touches[0];
      touchStartX = t.clientX; touchStartY = t.clientY;
    }, { passive: true });

    lightbox.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx)) {
        if (dy > 0) closeLb();
      } else if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        dx < 0 ? showNext() : showPrev();
      }
    }, { passive: true });

    favToggleBtn.addEventListener('click', () => {
      if (mode === 'browse') {
        mode = 'favorites';
        loadMoreBtn.style.display = 'none';
        renderFavoritesGrid();
      } else {
        mode = 'browse';
        loadMoreBtn.style.display = 'inline-block';
        renderBrowseGrid();
      }
      renderStats();
      updateFavToggleLabel();
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('hero').style.display = 'none';
      document.getElementById('statsBar').style.display = 'flex';
      document.getElementById('gallery').classList.add('visible');
      loadBatch();
    });

    loadMoreBtn.addEventListener('click', loadBatch);

    updateFavToggleLabel();
  </script>
</body>
</html>
