<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meow Gallery — lxwis</title>
  <meta name="description" content="Random cat gallery." />
  <meta name="theme-color" content="#0E0E0E" />
  <link rel="icon" type="image/webp" href="https://i.imgur.com/9jrzHF1_d.webp?maxwidth=64&fidelity=grand" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@0,300;0,400;0,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:   #0E0E0E;
      --paper: #EDE8DE;
      --warm:  #C8A97E;
      --sage:  #7EB89A;
      --muted: #6B6257;
      --dim:   #3A3530;
      --serif: 'Playfair Display', Georgia, serif;
      --mono:  'DM Mono', monospace;
    }

    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      background: var(--ink);
      color: var(--paper);
      font-family: var(--mono);
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }

    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-thumb { background: var(--sage); }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
    .wrap-narrow { max-width: 780px; margin: 0 auto; padding: 0 2rem; }

    header {
      padding: 2.5rem 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 2rem 0;
    }
    .logo {
      font-family: var(--serif);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--paper);
    }
    .logo em { color: var(--warm); font-style: italic; }
    .nav-back {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      transition: color .2s;
    }
    .nav-back:hover { color: var(--paper); }

    .hero {
      max-width: 780px;
      margin: 0 auto;
      padding: 6rem 2rem 4rem;
      border-bottom: 1px solid var(--dim);
    }
    .hero-eyebrow {
      font-size: 0.65rem;
      color: var(--sage);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .hero-eyebrow::before {
      content: '';
      display: block;
      width: 24px;
      height: 1px;
      background: var(--sage);
    }
    .hero-title {
      font-family: var(--serif);
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--paper);
      margin-bottom: 1.5rem;
    }
    .hero-title em { font-style: italic; color: var(--sage); }
    .hero-sub {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.8;
      max-width: 360px;
      margin-bottom: 2rem;
    }
    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--ink);
      background: var(--sage);
      padding: 0.75rem 1.5rem;
      border-radius: 2px;
      border: none;
      cursor: pointer;
      transition: opacity .2s;
      font-family: var(--mono);
    }
    .hero-btn:hover { opacity: 0.85; }

    .stats-bar {
      max-width: 780px;
      margin: 0 auto;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--dim);
    }
    .stat-text {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .stat-count {
      font-family: var(--serif);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--sage);
    }
    .load-more-btn {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--sage);
      background: none;
      border: 1px solid var(--dim);
      padding: 0.45rem 1rem;
      border-radius: 2px;
      cursor: pointer;
      font-family: var(--mono);
      transition: border-color .2s, color .2s;
    }
    .load-more-btn:hover { border-color: var(--sage); }

    .gallery {
      padding: 2rem;
      display: none;
    }
    .gallery.visible { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 3px;
    }

    .grid-item {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      background: #181410;
      cursor: pointer;
      opacity: 0;
      animation: appear .4s ease forwards;
    }
    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .5s ease, filter .3s;
      filter: grayscale(20%);
    }
    .grid-item:hover img {
      transform: scale(1.06);
      filter: grayscale(0%);
    }
    .grid-item .overlay {
      position: absolute;
      inset: 0;
      background: rgba(14,14,14,0.6);
      opacity: 0;
      transition: opacity .3s;
      display: flex;
      align-items: flex-end;
      padding: 0.75rem;
    }
    .grid-item:hover .overlay { opacity: 1; }
    .overlay-label {
      font-size: 0.58rem;
      color: var(--sage);
      letter-spacing: 0.1em;
    }
    .skeleton {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #181410 25%, #221e18 50%, #181410 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    .lightbox {
      position: fixed; inset: 0;
      z-index: 9999;
      background: rgba(14,14,14,0.97);
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      border: 1px solid var(--dim);
    }
    .lb-close {
      position: absolute;
      top: 1.5rem; right: 1.5rem;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: color .2s;
    }
    .lb-close:hover { color: var(--sage); }

    footer {
      max-width: 780px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
      border-top: 1px solid var(--dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-copy { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.08em; }
    .footer-link { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.1em; transition: color .2s; }
    .footer-link:hover { color: var(--sage); }

    .fade-in { opacity: 0; transform: translateY(12px); transition: opacity .55s ease, transform .55s ease; }
    .fade-in.visible { opacity: 1; transform: none; }
    .d1 { transition-delay: .04s; }
    .d2 { transition-delay: .1s; }
    .d3 { transition-delay: .17s; }
    .d4 { transition-delay: .24s; }

    @keyframes appear { from{opacity:0;transform:scale(.97)} to{opacity:1;transform:none} }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    @media (max-width: 560px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 2px; }
      .stats-bar { flex-direction: column; gap: 0.75rem; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">lx<em>wis</em></span>
    <a href="/" class="nav-back">← Home</a>
  </header>

  <div class="hero" id="hero">
    <p class="hero-eyebrow fade-in d1">Gallery</p>
    <h1 class="hero-title fade-in d2">Meow<br><em>Gallery.</em></h1>
    <p class="hero-sub fade-in d3">Random cats, every time. Click any image to open it full size.</p>
    <button class="hero-btn fade-in d4" id="startBtn">Show me cats →</button>
  </div>

  <div class="stats-bar" id="statsBar" style="display:none">
    <span class="stat-text"><span class="stat-count" id="countNum">0</span> cats loaded</span>
    <button class="load-more-btn" id="loadMoreBtn">Load more →</button>
  </div>

  <div class="gallery" id="gallery">
    <div class="grid" id="grid"></div>
  </div>

  <footer>
    <span class="footer-copy">lxwis.site — Meow Gallery</span>
    <a href="https://cataas.com" target="_blank" class="footer-link">Images via cataas.com ↗</a>
  </footer>

  <div class="lightbox" id="lightbox">
    <span class="lb-close" id="lbClose">ESC / CLOSE</span>
    <img id="lbImg" src="" alt="cat" />
  </div>

  <script>
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: 0.08 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    let count = 0;
    const BATCH = 30;
    const grid = document.getElementById('grid');
    const countNum = document.getElementById('countNum');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');

    function addSkeleton(delay) {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.style.animationDelay = delay + 's';
      item.innerHTML = '<div class="skeleton"></div>';
      grid.appendChild(item);
      return item;
    }

    async function fetchCat(item, delay) {
      try {
        const res = await fetch('https://cataas.com/cat?json=true');
        if (!res.ok) throw new Error();
        const data = await res.json();
        const id = data._id || data.id;
        const url = `https://cataas.com/cat/${id}`;
        const img = document.createElement('img');
        img.alt = 'cat';
        img.src = url;
        img.loading = 'lazy';
        const ov = document.createElement('div');
        ov.className = 'overlay';
        ov.innerHTML = '<span class="overlay-label">Open full →</span>';
        item.querySelector('.skeleton').remove();
        item.appendChild(img);
        item.appendChild(ov);
        item.addEventListener('click', () => openLb(url));
        count++;
        countNum.textContent = count;
      } catch {
        item.remove();
      }
    }

    function loadBatch() {
      for (let i = 0; i < BATCH; i++) {
        const item = addSkeleton(i * 0.03);
        fetchCat(item, i * 0.03);
      }
    }

    function openLb(url) { lbImg.src = url; lightbox.classList.add('open'); }
    function closeLb() { lightbox.classList.remove('open'); lbImg.src = ''; }

    document.getElementById('lbClose').addEventListener('click', closeLb);
    lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLb(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLb(); });

    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('hero').style.display = 'none';
      document.getElementById('statsBar').style.display = 'flex';
      document.getElementById('gallery').classList.add('visible');
      loadBatch();
    });

    document.getElementById('loadMoreBtn').addEventListener('click', loadBatch);
  </script>
</body>
</html>
