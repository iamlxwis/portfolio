name: Build BRAT Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main/brat/**'
      - 'android/brat/**'
      - '.github/workflows/brat-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/brat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/brat/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Generate offline assets and Android project
        run: npm run android:add
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brat-debug-apk
          path: android/brat/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
