name: Build BRAT Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main/brat/**'
      - 'android/brat/**'
      - '.github/workflows/brat-android.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/brat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "Android SDK is missing"; exit 1; }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate BRAT JavaScript and enhancement wiring
        run: |
          node --check ../../main/brat/script.js
          node --check ../../main/brat/enhancements.js
          node --check scripts/prepare-web.mjs
          node -e "const fs=require('fs');const html=fs.readFileSync('../../main/brat/index.html','utf8');const core=html.indexOf('/brat/assets/js/script.js?v='),extra=html.indexOf('/brat/assets/js/enhancements.js?v=');if(core<0||extra<core||!html.includes('wrapMode'))process.exit(1)"
      - name: Install dependencies
        run: npm install
      - name: Generate offline assets and Android project
        run: npm run android:add
      - name: Install native gallery saving plugin
        run: node scripts/install-gallery.mjs
      - name: Generate classic green BRAT app icon
        run: npm run android:icons
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brat-apk
          path: android/brat/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare direct APK download
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/brat.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view brat-android-test >/dev/null 2>&1; then
            gh release upload brat-android-test release/brat.apk --clobber
          else
            gh release create brat-android-test release/brat.apk --title "BRAT Android — test APK" --notes "Offline BRAT editor for Android. Debug-signed testing build, not a Play Store release." --prerelease
          fi
