name: Website UI smoke
on:
  push:
    branches: [feat/home-ux-2026]
  pull_request:
    paths: ['main/**', 'tests/**', '.github/workflows/site-ui-smoke.yml']
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check main/assets/js/home.js
          node --check main/assets/js/ux.js
          node --check main/assets/shared/privacy.js
          node --check main/brat/assets/js/script.js
          node --check main/brat/assets/js/enhancements.js
          node --check main/meow/assets/script.js
          node --check main/arf/assets/script.js
      - name: Install browser dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run responsive and accessibility smoke tests
        working-directory: tests
        run: npm run smoke
      - name: Attach visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-ui-screenshots
          path: tests/artifacts/
          if-no-files-found: ignore
